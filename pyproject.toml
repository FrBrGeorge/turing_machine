[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turing-machine-interpreter"
version = "0.0.1"
description = "Simple pure Python command-line Turing Machine tabular interpreter"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Fr. Br. George", email = "frbrgeorge@gmail.com"}
]
keywords = ["turing-machine", "interpreter", "theoretical-computer-science", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
turing-machine = "turing_machine.__main__:main"

[tool.setuptools.package-dir]
turing_machine = "turing_machine"
